<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLaVA Learning Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #1e293b;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            color: #60a5fa;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 1.1em;
        }
        
        .status-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-box {
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        
        .stat-label {
            color: #94a3b8;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #60a5fa;
        }
        
        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .demo-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #334155;
            transition: transform 0.2s, border-color 0.2s;
        }
        
        .demo-card:hover {
            transform: translateY(-4px);
            border-color: #60a5fa;
        }
        
        .demo-screenshots {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .screenshot {
            width: 100%;
            height: 200px;
            background: #0f172a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 0.9em;
            border: 1px solid #334155;
            overflow: hidden;
        }
        
        .screenshot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .demo-info {
            padding: 10px 0;
            border-top: 1px solid #334155;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.9em;
        }
        
        .label {
            color: #94a3b8;
        }
        
        .value {
            color: #e2e8f0;
            font-weight: 600;
        }
        
        .success {
            color: #10b981;
        }
        
        .failure {
            color: #ef4444;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.2em;
            color: #94a3b8;
        }
        
        .spinner {
            border: 4px solid #334155;
            border-top: 4px solid #60a5fa;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        button {
            background: #60a5fa;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #3b82f6;
        }
        
        .refresh-btn {
            display: block;
            margin: 0 auto 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 LLaVA Learning Visualization</h1>
            <p class="subtitle">Visual AI Training Progress & Demonstrations</p>
        </header>
        
        <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
        
        <div class="status-card">
            <h2>📊 Learning Statistics</h2>
            <div class="status-grid" id="stats">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading statistics...
                </div>
            </div>
        </div>
        
        <div class="status-card">
            <h2>👁️ User Demonstrations</h2>
            <div class="demo-grid" id="demonstrations">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading demonstrations...
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const AGENT_URL = 'http://localhost:8004';
        
        async function loadData() {
            await Promise.all([
                loadStats(),
                loadDemonstrations()
            ]);
        }
        
        async function loadStats() {
            try {
                const response = await fetch(`${AGENT_URL}/vision/learning-progress`);
                const data = await response.json();
                
                const statsHTML = `
                    <div class="stat-box">
                        <div class="stat-label">Total Demonstrations</div>
                        <div class="stat-value">${data.total_demonstrations || 0}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Action Types</div>
                        <div class="stat-value">${data.action_distribution?.length || 0}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Recent Hours Active</div>
                        <div class="stat-value">${data.timeline?.length || 0}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Avg Success Rate</div>
                        <div class="stat-value">
                            ${data.timeline && data.timeline.length > 0 
                                ? Math.round(data.timeline.reduce((sum, t) => sum + t.success_rate, 0) / data.timeline.length * 100) 
                                : 0}%
                        </div>
                    </div>
                `;
                
                document.getElementById('stats').innerHTML = statsHTML;
            } catch (error) {
                document.getElementById('stats').innerHTML = `
                    <div class="loading" style="color: #ef4444;">
                        ❌ Failed to load statistics: ${error.message}
                    </div>
                `;
            }
        }
        
        async function loadDemonstrations() {
            try {
                const response = await fetch(`${AGENT_URL}/vision/learned-data?limit=50`);
                const data = await response.json();
                
                if (data.demonstrations.length === 0) {
                    document.getElementById('demonstrations').innerHTML = `
                        <div class="loading">
                            📝 No demonstrations yet. Start playing in user_guided mode to collect training data!
                        </div>
                    `;
                    return;
                }
                
                const demosHTML = data.demonstrations.map(demo => `
                    <div class="demo-card">
                        <div class="demo-screenshots">
                            <div class="screenshot">
                                ${demo.screenshots.before 
                                    ? `<img src="${demo.screenshots.before}" alt="Before">` 
                                    : 'Before'
                                }
                            </div>
                            <div class="screenshot">
                                ${demo.screenshots.after 
                                    ? `<img src="${demo.screenshots.after}" alt="After">` 
                                    : 'After'
                                }
                            </div>
                        </div>
                        <div class="demo-info">
                            <div class="info-row">
                                <span class="label">Action:</span>
                                <span class="value">${demo.action.type}</span>
                            </div>
                            ${demo.action.params?.x && demo.action.params?.y ? `
                                <div class="info-row">
                                    <span class="label">Position:</span>
                                    <span class="value">(${demo.action.params.x}, ${demo.action.params.y})</span>
                                </div>
                            ` : ''}
                            <div class="info-row">
                                <span class="label">Reward:</span>
                                <span class="value ${demo.outcome.reward > 0 ? 'success' : 'failure'}">
                                    ${demo.outcome.reward.toFixed(2)}
                                </span>
                            </div>
                            <div class="info-row">
                                <span class="label">Success:</span>
                                <span class="value ${demo.outcome.led_to_progress ? 'success' : ''}">
                                    ${demo.outcome.led_to_progress ? '✅ Yes' : '❌ No'}
                                </span>
                            </div>
                            ${demo.analysis.detected_text ? `
                                <div class="info-row">
                                    <span class="label">OCR Text:</span>
                                    <span class="value" style="font-size: 0.85em;">${demo.analysis.detected_text.substring(0, 50)}...</span>
                                </div>
                            ` : ''}
                            <div class="info-row">
                                <span class="label">Time:</span>
                                <span class="value" style="font-size: 0.85em;">
                                    ${new Date(demo.timestamp).toLocaleString()}
                                </span>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                document.getElementById('demonstrations').innerHTML = demosHTML;
            } catch (error) {
                document.getElementById('demonstrations').innerHTML = `
                    <div class="loading" style="color: #ef4444;">
                        ❌ Failed to load demonstrations: ${error.message}
                    </div>
                `;
            }
        }
        
        // Load data on page load
        loadData();
        
        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
