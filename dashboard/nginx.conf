server {
    listen 3000;
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Increase max upload size for APK files
    client_max_body_size 500M;

    # Use variable to avoid nginx failing when orchestrator is not available
    set $backend "orchestrator:8000";
    
    # API proxy (preserve /api/ prefix)
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        proxy_pass http://$backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Increase timeouts for large file uploads
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        
        # Handle errors gracefully
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    # WebSocket proxy
    location /socket.io/ {
        resolver 127.0.0.11 valid=30s;
        proxy_pass http://$backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Handle errors gracefully
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }
    
    # Backend unavailable handler
    location @backend_unavailable {
        add_header Content-Type application/json;
        return 503 '{"error": "Backend service unavailable", "message": "The API backend is currently not available"}';
    }

    # React Router - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
}
