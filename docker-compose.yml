services:
  # ============================================
  # 1. PHYSICAL DEVICE / EMULATOR CONNECTION
  # ============================================
  # PHYSICAL DEVICE (Recommended):
  # 1. Enable USB Debugging on Android phone
  # 2. Connect via USB: adb devices
  # 3. Authorize on device screen
  # 4. Enable TCP: adb tcpip 5555
  # 5. Get device IP: adb shell ip addr show wlan0 | findstr inet
  # 6. Connect WiFi: adb connect <IP>:5555
  # 7. Disconnect USB (device stays connected over WiFi)
  # 8. From Docker containers, device is accessible as: host.docker.internal:5555
  #
  # EMULATOR (Alternative):
  # 1. Start Android Studio emulator: emulator -avd Pixel_5_API_30 -no-window
  # 2. Enable ADB over TCP: adb tcpip 5555
  # 3. Connect: adb connect localhost:5555
  # 4. From Docker containers: host.docker.internal:5555
  #
  # NOTE: Redroid emulator doesn't work on Windows Docker (binderfs issues)

  # ============================================
  # 2. DEVICE MANAGER (Handles Physical Device / Emulator)
  # ============================================
  emulator-manager:
    image: playmetric-emulator-manager:latest
    build:
      context: .
      dockerfile: emulator_manager/Dockerfile
      args:
        BASE_IMAGE: playmetric-base:latest
    container_name: playmetric-emulator-manager
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8005:8005"
    environment:
      # For emulators: use host.docker.internal to access host machine's emulator
      # Physical device connections are handled dynamically via /device/connect API
      - EMULATOR_HOST=host.docker.internal  # Always use host.docker.internal for emulator access
      - EMULATOR_PORT=5555
      - USE_HOST_ADB=false  # Connect directly to emulator, not ADB server
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_USER=${DB_USER:-playmetric}
      - DB_PASSWORD=${DB_PASSWORD:-playmetric123}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-playmetric}
      - API_PORT=8005
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allow container to reach Windows host
    volumes:
      - ./apks:/apks
      - ./shared:/app/shared
      - screenshot-data:/tmp  # Shared volume for screenshots
      - ${USERPROFILE}/.android:/root/.android:ro
    networks:
      - playmetric-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # 3. OBSERVATION SERVICE
  # ============================================
  observation:
    image: playmetric-observation:latest
    build:
      context: ./observation
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: playmetric-base-adb:latest
    container_name: playmetric-observation
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      - EMULATOR_HOST=host.docker.internal  # Connect to host machine emulator
      - ADB_PORT=${ADB_PORT:-5555}
      - SCREENSHOT_INTERVAL=${SCREENSHOT_INTERVAL:-0.0625}  # 16 FPS = 1/16 = 0.0625 seconds
      - SCREENSHOT_FPS=16
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_USER=${DB_USER:-playmetric}
      - DB_PASSWORD=${DB_PASSWORD:-playmetric123}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-playmetric}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data/screenshots:/data/screenshots
      - ./data/logs:/data/logs
      - ./shared:/app/shared
      - ${USERPROFILE}/.android:/root/.android:ro  # Mount ADB keys for authorization
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - playmetric-network
    restart: unless-stopped



  # ============================================
  # 4. ANALYTICS ENGINE
  # ============================================
  analytics:
    image: playmetric-analytics:latest
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: playmetric-analytics
    depends_on:
      - observation
      - postgres
    ports:
      - "8003:8003"
    environment:
      - DIFFICULTY_THRESHOLD=${DIFFICULTY_THRESHOLD:-0.7}
      - RETENTION_SIMULATION_DAYS=${RETENTION_SIMULATION_DAYS:-7,30}
      - ENABLE_OCR=${ENABLE_OCR:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_USER=${DB_USER:-playmetric}
      - DB_PASSWORD=${DB_PASSWORD:-playmetric123}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-playmetric}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data/analytics:/data/analytics
      - ./data/screenshots:/data/screenshots:ro
      - ./data/logs:/data/logs:ro
      - ./data/crashes:/data/crashes:ro
      - ./shared:/app/shared
    networks:
      - playmetric-network
    restart: unless-stopped

  # ============================================
  # 5. VISION AI SERVICE (BLIP-2/Gemini/OCR)
  # ============================================
  vision:
    image: playmetric-vision:latest
    build:
      context: ./vision
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: playmetric-base-ml:latest
    container_name: playmetric-vision
    depends_on:
      - postgres
    ports:
      - "8006:8006"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8006
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data/models:/data/models  # BLIP-2 model cache
      - ./data/screenshots:/data/screenshots
      - ./shared:/app/shared
    networks:
      - playmetric-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G  # BLIP-2 uses ~1.6GB
        reservations:
          memory: 2G

  # ============================================
  # 6. LEARNING SERVICE (Offline Video Analysis)
  # ============================================
  learning:
    image: playmetric-learning:latest
    build:
      context: ./learning
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: playmetric-base-ml:latest
    container_name: playmetric-learning
    depends_on:
      - vision
      - postgres
    ports:
      - "8007:8007"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8007
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VISION_SERVICE_URL=http://vision:8006
    volumes:
      - ./data/videos:/data/videos
      - ./data/knowledge:/data/knowledge
      - ./data/screenshots:/data/screenshots
      - ./shared:/app/shared
    networks:
      - playmetric-network
    restart: unless-stopped

  # ============================================
  # 7. AI PLAYER SERVICE (Decision Engine)
  # ============================================
  ai-player:
    image: playmetric-ai-player:latest
    build:
      context: ./ai_player
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: playmetric-base-ml:latest
    container_name: playmetric-ai-player
    depends_on:
      - vision
      - observation
      - learning
      - postgres
    ports:
      - "8008:8008"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8008
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VISION_SERVICE_URL=http://vision:8006
      - OBSERVATION_SERVICE_URL=http://observation:8001
    volumes:
      - ./data/knowledge:/data/knowledge
      - ./data/screenshots:/data/screenshots
      - ./data/decisions:/data/decisions
      - ./shared:/app/shared
    networks:
      - playmetric-network
    restart: unless-stopped

  # ============================================
  # 8. AI AGENT (DEPRECATED - USE AI PLAYER)
  # ============================================
  # agent:
  #   # This service is being replaced by ai-player with decision engine
  #   # Keeping commented for reference
    image: playmetric-agent:latest
    build:
      context: ./agent
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: playmetric-base-ml:latest
    container_name: playmetric-agent
    depends_on:
      - observation
      - vision
      # - emulator  # Using host machine emulator
      - postgres
      - redis
    ports:
      - "8004:8004"
    environment:
      - AGENT_MODE=${AGENT_MODE:-heuristic}
      - ACTION_INTERVAL=${ACTION_INTERVAL:-1.5}
      - OBSERVATION_URL=http://observation:8001
      - VISION_URL=http://vision:8006
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - EMULATOR_MANAGER_URL=http://emulator-manager:8005
      - EMULATOR_HOST=${DEVICE_IP:-host.docker.internal}  # Physical device IP
      - ADB_PORT=${ADB_PORT:-5555}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_USER=${DB_USER:-playmetric}
      - DB_PASSWORD=${DB_PASSWORD:-playmetric123}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-playmetric}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # SCREEN_WIDTH and SCREEN_HEIGHT auto-detected at session start
      # These are only fallback defaults if detection fails
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1080}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-1920}
    volumes:
      - ./data/screenshots:/data/screenshots:ro
      - ./shared:/app/shared
      - agent-data:/agent/data
      - screenshot-data:/tmp  # Shared volume for screenshots with emulator-manager
      - ${USERPROFILE}/.android:/root/.android:ro  # Mount ADB keys for authorization
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - playmetric-network
    restart: unless-stopped

  # ============================================
  # 9. ORCHESTRATOR API
  # ============================================
  orchestrator:
    image: playmetric-orchestrator:latest
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: playmetric-base-adb:latest
    container_name: playmetric-orchestrator
    depends_on:
      # - emulator  # Using host machine emulator
      - observation
      - analytics
      - agent
      - postgres
      - redis
    ports:
      - "8000:8000"
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - EMULATOR_HOST=emulator
      - OBSERVATION_URL=http://observation:8001
      - ANALYTICS_URL=http://analytics:8003
      - AGENT_URL=http://agent:8004
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_USER=${DB_USER:-playmetric}
      - DB_PASSWORD=${DB_PASSWORD:-playmetric123}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-playmetric}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./apks:/apks
      - ./data:/data
      - ./shared:/app/shared
      - orchestrator-data:/app/data
    networks:
      - playmetric-network
    restart: unless-stopped

  # ============================================
  # 10. DATABASE - PostgreSQL with TimescaleDB
  # ============================================
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: playmetric-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-playmetric}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-playmetric123}
      - POSTGRES_DB=${DB_NAME:-playmetric}
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - playmetric-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playmetric"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # 11. REDIS (Caching & Session Management)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: playmetric-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - playmetric-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================
  # 12. DASHBOARD (Static HTML)
  # ============================================
  dashboard:
    image: playmetric-dashboard:latest
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: playmetric-dashboard
    depends_on:
      - orchestrator
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_SOCKET_URL=http://localhost:8000
    networks:
      - playmetric-network
    restart: unless-stopped



networks:
  playmetric-network:
    driver: bridge

volumes:
  emulator-data:
  agent-data:
  orchestrator-data:
  postgres-data:
  redis-data:
  screenshot-data:  # Shared volume for screenshots between emulator-manager and agent
