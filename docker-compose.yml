services:
  # ============================================
  # 1. ANDROID EMULATOR (Host Machine Mode)
  # ============================================
  # IMPORTANT: This config assumes you're running Android Studio emulator on your Windows host machine
  # See HOST_EMULATOR_SETUP.md for setup instructions
  # 
  # Quick Start:
  # 1. Start Android Studio emulator: emulator -avd Pixel_5_API_30 -no-window
  # 2. Enable ADB over TCP: adb tcpip 5555
  # 3. Verify connection: adb connect localhost:5555
  # 4. Start services: docker-compose up
  #
  # NOTE: Redroid emulator is commented out due to Windows Docker binderfs issues
  # Uncomment below if running on Linux with proper kernel support
  #
  # emulator:
  #   image: redroid/redroid:11.0.0-latest
  #   container_name: playmetric-emulator
  #   privileged: true
  #   ports:
  #     - "5555:5555"    # ADB
  #   command: androidboot.use_memfd=1 androidboot.redroid_gpu_mode=guest
  #   environment:
  #     - REDROID_GPU_MODE=guest
  #     - REDROID_WIDTH=1080
  #     - REDROID_HEIGHT=1920
  #     - REDROID_DPI=480
  #     - REDROID_FPS=30
  #   volumes:
  #     - ./apks:/apks
  #     - emulator-data:/data
  #   networks:
  #     - playmetric-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "test -e /dev/binderfs/binder || exit 1"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 40
  #     start_period: 180s
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '${EMULATOR_CORES:-4}'
  #         memory: ${EMULATOR_MEMORY:-3072}M

  # ============================================
  # 2. EMULATOR MANAGER (Host Emulator Mode)
  # ============================================
  emulator-manager:
    build:
      context: .
      dockerfile: emulator_manager/Dockerfile
    container_name: playmetric-emulator-manager
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8005:8005"
    environment:
      - EMULATOR_HOST=host.docker.internal  # Connect to host machine emulator
      - EMULATOR_PORT=5555
      - USE_HOST_ADB=false  # Connect directly to emulator, not ADB server
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_USER=${DB_USER:-playmetric}
      - DB_PASSWORD=${DB_PASSWORD:-playmetric123}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-playmetric}
      - API_PORT=8005
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allow container to reach Windows host
    volumes:
      - ./apks:/apks
      - ./shared:/app/shared
    networks:
      - playmetric-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # 2B. EMULATOR STREAM (Live View)
  # ============================================
  emulator-stream:
    build:
      context: ./emulator_stream
      dockerfile: Dockerfile
    container_name: playmetric-emulator-stream
    ports:
      - "8006:8006"
    environment:
      - EMULATOR_HOST=host.docker.internal  # Connect to host machine emulator
      - ADB_PORT=5555
      - STREAM_FPS=3
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - playmetric-network
    restart: unless-stopped

  # ============================================
  # 3. OBSERVATION SERVICE
  # ============================================
  observation:
    build:
      context: ./observation
      dockerfile: Dockerfile
    container_name: playmetric-observation
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      - EMULATOR_HOST=host.docker.internal  # Connect to host machine emulator
      - ADB_PORT=${ADB_PORT:-5555}
      - SCREENSHOT_INTERVAL=${SCREENSHOT_INTERVAL:-0.333}
      - SCREENSHOT_FPS=3
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_USER=${DB_USER:-playmetric}
      - DB_PASSWORD=${DB_PASSWORD:-playmetric123}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-playmetric}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data/screenshots:/data/screenshots
      - ./data/logs:/data/logs
      - ./shared:/app/shared
      - ${USERPROFILE}/.android:/root/.android:ro  # Mount ADB keys for authorization
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - playmetric-network
    restart: unless-stopped

  # ============================================
  # 3. CRASH DETECTOR
  # ============================================
  crash-detector:
    build:
      context: ./crash_detector
      dockerfile: Dockerfile
    container_name: playmetric-crash-detector
    depends_on:
      # emulator:  # Using host machine emulator
      #   condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      - EMULATOR_HOST=host.docker.internal  # Connect to host machine emulator
      - ADB_PORT=${ADB_PORT:-5555}
      - CRASH_CHECK_INTERVAL=${CRASH_CHECK_INTERVAL:-2.0}
      - ANR_TIMEOUT=${ANR_TIMEOUT:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_USER=${DB_USER:-playmetric}
      - DB_PASSWORD=${DB_PASSWORD:-playmetric123}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-playmetric}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data/crashes:/data/crashes
      - ./data/logs:/data/logs
      - ./shared:/app/shared
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - playmetric-network
    restart: unless-stopped

  # ============================================
  # 4. ANALYTICS ENGINE
  # ============================================
  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: playmetric-analytics
    depends_on:
      - observation
      - crash-detector
      - postgres
    ports:
      - "8003:8003"
    environment:
      - DIFFICULTY_THRESHOLD=${DIFFICULTY_THRESHOLD:-0.7}
      - RETENTION_SIMULATION_DAYS=${RETENTION_SIMULATION_DAYS:-7,30}
      - ENABLE_OCR=${ENABLE_OCR:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_USER=${DB_USER:-playmetric}
      - DB_PASSWORD=${DB_PASSWORD:-playmetric123}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-playmetric}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data/analytics:/data/analytics
      - ./data/screenshots:/data/screenshots:ro
      - ./data/logs:/data/logs:ro
      - ./data/crashes:/data/crashes:ro
      - ./shared:/app/shared
    networks:
      - playmetric-network
    restart: unless-stopped

  # ============================================
  # 5. AI AGENT (Advanced RL)
  # ============================================
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: playmetric-agent
    depends_on:
      - observation
      # - emulator  # Using host machine emulator
      - postgres
      - redis
    ports:
      - "8004:8004"
    environment:
      - AGENT_MODE=${AGENT_MODE:-heuristic}
      - ACTION_INTERVAL=${ACTION_INTERVAL:-1.5}
      - OBSERVATION_URL=http://observation:8001
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - EMULATOR_MANAGER_URL=http://emulator-manager:8005
      - EMULATOR_HOST=host.docker.internal  # Connect to host machine emulator
      - ADB_PORT=${ADB_PORT:-5555}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_USER=${DB_USER:-playmetric}
      - DB_PASSWORD=${DB_PASSWORD:-playmetric123}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-playmetric}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1080}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-1920}
    volumes:
      - ./data/models:/data/models
      - ./data/screenshots:/data/screenshots:ro
      - ./shared:/app/shared
      - agent-data:/agent/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - playmetric-network
    restart: unless-stopped

  # ============================================
  # 6. ORCHESTRATOR API
  # ============================================
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: playmetric-orchestrator
    depends_on:
      # - emulator  # Using host machine emulator
      - observation
      - crash-detector
      - analytics
      - agent
      - postgres
      - redis
    ports:
      - "8000:8000"
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - EMULATOR_HOST=emulator
      - OBSERVATION_URL=http://observation:8001
      - CRASH_DETECTOR_URL=http://crash-detector:8002
      - ANALYTICS_URL=http://analytics:8003
      - AGENT_URL=http://agent:8004
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_USER=${DB_USER:-playmetric}
      - DB_PASSWORD=${DB_PASSWORD:-playmetric123}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-playmetric}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./apks:/apks
      - ./data:/data
      - ./shared:/app/shared
      - orchestrator-data:/app/data
    networks:
      - playmetric-network
    restart: unless-stopped

  # ============================================
  # 7. DATABASE - PostgreSQL with TimescaleDB
  # ============================================
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: playmetric-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-playmetric}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-playmetric123}
      - POSTGRES_DB=${DB_NAME:-playmetric}
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - playmetric-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playmetric"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # 8. REDIS (Caching & Session Management)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: playmetric-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - playmetric-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================
  # 9. DASHBOARD (React Frontend)
  # ============================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: playmetric-dashboard
    depends_on:
      - orchestrator
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_SOCKET_URL=http://localhost:8000
    networks:
      - playmetric-network
    restart: unless-stopped

  # ============================================
  # 10. MONITORING (Optional - Grafana + Prometheus)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: playmetric-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - playmetric-network
    restart: unless-stopped
    profiles:
      - with-monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: playmetric-grafana
    ports:
      - "4000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    networks:
      - playmetric-network
    restart: unless-stopped
    profiles:
      - with-monitoring

networks:
  playmetric-network:
    driver: bridge

volumes:
  emulator-data:
  agent-data:
  orchestrator-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
