[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1080x1920x24
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_err.log
environment=DISPLAY=:99

[program:emulator]
command=/opt/android-sdk/emulator/emulator -avd test_device -no-audio -no-window -no-accel -gpu swiftshader_indirect -memory 2048 -partition-size 2048 -no-snapshot -no-boot-anim -no-metrics
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/emulator.log
stderr_logfile=/var/log/supervisor/emulator_err.log
environment=DISPLAY=:99,ANDROID_SDK_ROOT=/opt/android-sdk

[program:vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/vnc.log
stderr_logfile=/var/log/supervisor/vnc_err.log
environment=DISPLAY=:99

[program:adb]
command=/opt/android-sdk/platform-tools/adb -a nodaemon server
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/adb.log
stderr_logfile=/var/log/supervisor/adb_err.log
