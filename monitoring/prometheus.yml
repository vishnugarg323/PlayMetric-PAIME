global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:8000']
  
  - job_name: 'observation'
    static_configs:
      - targets: ['observation:8001']
  
  - job_name: 'crash-detector'
    static_configs:
      - targets: ['crash-detector:8002']
  
  - job_name: 'analytics'
    static_configs:
      - targets: ['analytics:8003']
  
  - job_name: 'agent'
    static_configs:
      - targets: ['agent:8004']
