events {
    worker_connections 1024;
}

http {
    # Upstream vision workers with load balancing
    upstream vision_workers {
        least_conn;  # Route to least busy worker
        
        server vision-worker-1:8006 max_fails=3 fail_timeout=30s;
        server vision-worker-2:8006 max_fails=3 fail_timeout=30s;
        server vision-worker-3:8006 max_fails=3 fail_timeout=30s;
        
        keepalive 32;  # Keep connections alive for better performance
    }

    server {
        listen 8006;
        
        # Increased timeouts for ML processing (BLIP-2 + Gemini can take 150-200s per frame)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        
        # Larger buffer sizes for ML responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        location / {
            proxy_pass http://vision_workers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for streaming responses
            proxy_buffering off;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
